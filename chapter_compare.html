<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单章点击 · 数据助手</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px 16px;background:var(--bg);color:var(--text);font:calc(13px * var(--scale,1))/1.6 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif}main{max-width:1080px;margin:auto;padding:24px;background:var(--surface);border-radius:20px;box-shadow:0 12px 40px #0000000c}header,.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}h1{font-size:calc(19px * var(--scale,1));margin:0}a{color:var(--text);text-decoration:none}select{font:inherit;padding:9px 12px;border:0;border-radius:10px;background:var(--soft);color:var(--text)}.controls{justify-content:flex-start;margin:24px 0 16px}.muted{color:var(--muted);font-size:calc(11px * var(--scale,1))}.wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:12px;border:0}th{color:var(--muted);font-weight:400;background:var(--panel)}tbody tr:nth-child(even){background:var(--panel)}.pos{color:#70a88b}.neg{color:#cd7777}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:600px){main{padding:18px 12px}body{padding:12px 8px}}

main{max-width:1380px;padding:32px 36px;min-height:85vh}.controls{justify-content:space-between}.tabs{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--soft);color:var(--text);cursor:pointer}.tabs button{background:transparent;color:var(--muted)}.tabs button.selected{background:var(--soft);color:var(--text)}.change-up{color:#db6262}.change-down{color:#578cd6}.increment-row td{padding-top:2px;color:var(--muted)}.table-wrap{overflow:auto}.chart{width:100%;height:360px}.badge{display:inline-block;margin-left:10px;background:var(--soft);color:var(--text);font-size:12px;font-weight:400;border-radius:10px;padding:3px 8px}#metric{max-width:240px}.note{margin:16px 0 24px}small{color:var(--muted)}@media(max-width:700px){main{padding:22px 14px}}
.primary{background:var(--update-bg,#3370ff);color:var(--update-text,#fff)}button:disabled{opacity:.6;cursor:wait}.tabs button.selected{background:var(--update-bg,#3370ff)!important;color:var(--update-text,#fff)!important;font-weight:600}.tabs button.selected{background:var(--soft)!important;color:var(--text)!important;font-weight:600}table{width:max-content;min-width:100%;table-layout:fixed}th,td{padding:6px 7px;min-width:66px;width:66px;text-align:right;font-variant-numeric:tabular-nums}th:first-child,td:first-child{position:sticky;left:0;min-width:154px;width:154px;text-align:left;background:var(--surface);z-index:1}th:first-child{background:var(--panel)}.increment-row td:first-child{background:var(--panel)}th{font-size:12px}.note{margin:10px 0 16px}.change-up{color:#F54A45}.change-down{color:#629BF1}</style></head><body><main><header><h1 id="title">单章点击</h1><div><button id="chapterUpdate" class="primary">更新数据</button><a href="./" style="margin-left:16px">返回作品列表</a></div></header><div class="controls"><nav class="tabs" id="tabs" aria-label="数据分类"></nav><div><select id="metric" aria-label="折线图指标" hidden></select><button id="switchView" title="切换为折线图" aria-label="切换为折线图">⌁</button></div></div><p id="notice" role="status" class="muted" hidden></p><p class="muted note" id="scope"></p><div id="content"></div></main><script src="./browser-store.js"></script><script src="./review.js"></script><script>
const $=id=>document.getElementById(id);let records=[],mode='history',view='table',vip=false,metrics={},chapterTitles={};
const icons={chart:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4v16h16M7 15l4-6 4 3 5-7"/></svg>',list:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 6h12M8 12h12M8 18h12M4 6h.1M4 12h.1M4 18h.1"/></svg>'};
function show(){
 $('tabs').innerHTML=Object.entries({history:'历史数据',day:'日',week:'周',month:'月'}).map(([k,l])=>`<button data-mode="${k}" class="${mode===k?'selected':''}" aria-pressed="${mode===k}">${l}</button>`).join('');
 const rows=periodRecords(records,mode),hint={history:'每次更新与上一次比较。',day:'每天取最后一次，与上一记录日比较。',week:'周四 00:00 至下周三 23:59，比较本周与上周新增。',month:'按自然月比较本月与上月新增。'}[mode];
 $('scope').textContent=hint+(vip?' 入 V 后记录最新章节、点击合计与均值；此前单章历史保留。点击口径以公开范围为准。':' 最新章节在左，悬停查看章节名；未公开的点击显示 -。')+(['week','month'].includes(mode)?' 未结束周期截至当前，缺少基准显示 -。':'');
 $('metric').hidden=view!=='chart';const target=view==='table'?'折线图':'列表';$('switchView').innerHTML=icons[view==='table'?'chart':'list'];$('switchView').title='切换为'+target;$('switchView').setAttribute('aria-label','切换为'+target);
 $('content').innerHTML=view==='table'?reviewTable(rows,metrics,mode):reviewChart(rows,$('metric').value,metrics[$('metric').value]);if(view==='table')document.querySelectorAll('#content th').forEach((cell,i)=>{if(i)cell.title=chapterTitles[Object.keys(metrics)[i-1]]||''});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;show()}});$('switchView').onclick=()=>{view=view==='table'?'chart':'table';show()};$('metric').onchange=show;
async function load(){try{const q=new URLSearchParams(location.search),r=await fetch('/api/chapter-state?'+new URLSearchParams({profile:q.get('profile')||'',book:q.get('book')||''}));const data=await r.json();if(!r.ok)throw Error(data.error);
records=data.book.history;vip=records.some(r=>r.isVip||(r.chapterDetails||[]).some(c=>c.vip));
$('title').innerHTML=reviewEscape(data.book.name)+' · 单章点击'+(vip?'<span class="badge">入 V</span>':'');
const chapters=new Map();records.forEach(r=>(r.chapterDetails||[]).forEach(c=>{if(!vip||(r.chapterClicksMode!=='summaryOnly'&&c.clicks!=null))chapters.set(c.id,c.title)}));chapterTitles=Object.fromEntries([...chapters].map(([id,title])=>['chapter_'+id,title]));metrics=Object.fromEntries([...chapters].sort((a,b)=>b[0]-a[0]).map(([id])=>['chapter_'+id,'第'+id+'章']));records=records.map(r=>({...r,...Object.fromEntries((r.chapterDetails||[]).map(c=>['chapter_'+c.id,r.chapterClicksMode==='summaryOnly'?null:c.clicks]))}));if(vip){metrics={lastChapter:'最新章节',totalClicks:'点击合计',avgClicks:'均点击',...metrics};chapterTitles.lastChapter='当前最新章节编号';chapterTitles.totalClicks=records.some(r=>r.totalClicksScope==='nonVip')?'入 V 后按公开非 V 章节点击合计':'公开总点击';chapterTitles.avgClicks='按来源公开范围统计的均点击'}
$('metric').innerHTML=Object.entries(metrics).map(([k,l])=>'<option value="'+reviewEscape(k)+'">'+reviewEscape(l)+'</option>').join('');
const palettes={day:['#f5f6fa','#ffffff','#f7f8fa','#f0f1f5'],night:['#17191e','#22252c','#1c1f26','#30343d'],yellow:['#f7f4e9','#fffdf6','#f1ebd7','#f0e7c8'],green:['#edf5ef','#fbfdf9','#deece0','#e0ece0'],blue:['#eef3f8','#fbfcfe','#e0e9f2','#e0e9f3'],pink:['#f8eff2','#fffafb','#f0dfe5','#f1dfe6'],purple:['#f3eff8','#fdfbff','#e9e1f2','#e9e0f2'],peach:['#faf1e9','#fffcf8','#f4e4d6','#f4e3d4']};const mode=data.theme?.mode,p=palettes[mode]||palettes.day;['bg','surface','panel','soft'].forEach((k,i)=>document.documentElement.style.setProperty('--'+k,p[i]));document.documentElement.style.setProperty('--text',mode==='night'?'#e5e8ee':'#42404a');document.documentElement.style.setProperty('--muted',mode==='night'?'#9199a8':'#969ba4');document.documentElement.style.setProperty('--scale',String((data.ui?.fontSize||13)/13));document.documentElement.style.colorScheme=mode==='night'?'dark':'light';document.documentElement.style.setProperty('--update-bg',mode==='night'?'#83a7ff':({yellow:'#ead58a',green:'#b6d7bc',blue:'#b2cbe5',pink:'#e5b5c7',purple:'#cfbce7',peach:'#edc1a2'}[mode]||'#629BF1'));document.documentElement.style.setProperty('--update-text',mode==='day'||!mode?'#ffffff':'#303744');show()}catch(e){$('content').textContent=e.message}}
$('chapterUpdate').onclick=async()=>{
 const button=$('chapterUpdate');if(button.disabled)return;button.disabled=true;button.textContent='正在更新…';$('notice').hidden=false;$('notice').textContent='正在更新当前作品，请稍候…';
 try{const q=new URLSearchParams(location.search),state=await fetch('/api/state').then(r=>r.json());const r=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':state.token,'X-Profile-Key':q.get('profile')||''},body:JSON.stringify({id:q.get('book')})});const result=await r.json();if(!r.ok)throw Error(result.error||'更新失败');await load();$('notice').textContent=result.errors?.length?'本次未能更新，请稍后重试。':'数据已更新并保存到本机。'}catch(e){$('notice').textContent=e.message==='Failed to fetch'?'无法连接本地服务，请重新打开数据助手。':e.message}finally{button.disabled=false;button.textContent='更新数据'}
};
load();
</script></body></html>
